[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epitaxy"
version = "0.7.0"
description = "Epitaxy: a from-scratch Cpp2-syntax language with ownership/borrow checking that compiles to C++20"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Epitaxy contributors" }]
keywords = ["language", "compiler", "transpiler", "cpp2", "cppfront", "c++", "ownership", "borrow-checking"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://example.invalid/epitaxy"

[project.scripts]
epitaxy = "epitaxy.cli:main"

[tool.setuptools]
packages = ["epitaxy"]

[tool.setuptools.package-data]
epitaxy = ["support/*.hpp"]
